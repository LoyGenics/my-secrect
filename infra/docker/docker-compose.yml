# Self-host — one backend for cloud + self-host.
# Run from this folder: docker compose up --build
# Build contexts are relative to THIS compose file (infra/docker).
#   api context: ../../apps/api  -> my-secrect/apps/api, Dockerfile there.
# Secrets come from .env in this folder (copy .env.example first). Never commit .env.
#
# Exposure: Caddy is the only service with published ports (80/443).
# Outbound access exists on two networks only:
#   edge    : caddy (ACME / Let's Encrypt)
#   mail    : api   (SMTP to SMTP_ADDRESS:SMTP_PORT for sign-up codes; the
#             API sends with deliver_now inside the request). Docker cannot
#             limit this to one host/port: add a host firewall egress rule.
# Everything else sits on internal-only networks (no host ports, no egress):
#   proxy   : caddy, api, minio           (what Caddy may reach)
#   backend : api, worker, db, redis, minio, minio-init (Caddy cannot reach db/redis)
# The S3 API is public only via Caddy at s3.${SITE_ADDRESS}. If you swap
# MinIO for an external S3/R2, api and worker need an egress network too.
#
# Throwaway test stacks add docker-compose.test.yml (Mailpit as the SMTP
# server, with a per-run CA). Never use that override in production.
#
# The web client is the Vite build of apps/web (npm --workspace apps/web run
# build), mounted read-only into Caddy; override the path with WEB_DIST.
x-logging: &logging
  # Bounded local logs (5 x 10 MB per container); see docs/privacy.md (retention).
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

x-app-env: &app-env
  RAILS_ENV: production
  DATABASE_URL: postgres://vault:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/vault_production
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  # Origin clients use for presigned URLs (Caddy s3.<SITE_ADDRESS> -> minio:9000).
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required (public origin of the S3 API, e.g. https://s3.your-domain)}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
  WEBAUTHN_RP_NAME: my-secrect
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  # Sign-up verification codes are emailed; production refuses to boot
  # without these (apps/api/config/initializers/action_mailer.rb). STARTTLS
  # with certificate verification, or implicit TLS with SMTP_TLS_MODE=tls.
  SMTP_ADDRESS: ${SMTP_ADDRESS:?SMTP_ADDRESS is required (SMTP server for sign-up codes)}
  SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required (sender address of sign-up codes)}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
  # Optional sign-in providers (specs/account-sign-in.md). Unset ids hide the
  # matching "Continue with Google/Apple" button; email codes always work.
  GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
  GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
  GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
  GOOGLE_EXTENSION_CLIENT_ID: ${GOOGLE_EXTENSION_CLIENT_ID:-}
  APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
  APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
  BILLING_ENVIRONMENT: ${BILLING_ENVIRONMENT:-test}
  BILLING_WEB_URL: ${BILLING_WEB_URL:-}
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
  STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
  STRIPE_PRICE_LIFETIME: ${STRIPE_PRICE_LIFETIME:-}
  STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
  REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:-}
  REVENUECAT_WEBHOOK_AUTHORIZATION: ${REVENUECAT_WEBHOOK_AUTHORIZATION:-}
  REVENUECAT_ENTITLEMENT: ${REVENUECAT_ENTITLEMENT:-pro}
  REVENUECAT_PRODUCTS: ${REVENUECAT_PRODUCTS:-}

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_DIST:-../../apps/web/dist}:/srv:ro
      - vault_caddy_data:/data
      - vault_caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (your domain, or localhost for a local run)}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required (public origin of the S3 API, e.g. https://s3.your-domain)}
    networks: [edge, proxy]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    restart: unless-stopped
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    # Production boot refuses missing/placeholder secrets
    # (apps/api/config/environments/production.rb, storage_config.rb).
    environment:
      <<: *app-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMPORT_MODEL: ${OPENAI_IMPORT_MODEL:-gpt-4o-mini}
    # No host ports. Caddy reaches this process as api:3000.
    # force_ssl redirects plain HTTP, so the probe sends the same forwarded
    # proto Caddy sends and requires the /health body {"ok":true}.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -H "X-Forwarded-Proto: https" http://127.0.0.1:3000/health | grep -Fqx "{\"ok\":true}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [proxy, backend, mail]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    restart: unless-stopped
  worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    environment: *app-env
    # Healthy while THIS container's Sidekiq process heartbeats in Redis
    # (Sidekiq beats every ~10 s; a dead or hung process drops out within 60 s).
    healthcheck:
      test: ['CMD', 'bundle', 'exec', 'ruby', '-rsocket', '-rsidekiq/api', '-e', 'exit(Sidekiq::ProcessSet.new.any? { |p| p["hostname"] == Socket.gethostname } ? 0 : 1)']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: vault_production
    volumes: [vault_pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U vault -d vault_production'], interval: 5s, timeout: 5s, retries: 12 }
    networks: [backend]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10 }
    networks: [backend]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    restart: unless-stopped
  minio:
    # Docker Hub minio/minio is no longer published; override MINIO_IMAGE
    # (e.g. quay.io/minio/minio:<release>) if you prefer the upstream image,
    # but it must provide the `minio` binary as entrypoint args below.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    # No --console-address: the web console is not started at all.
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      MINIO_BROWSER: 'off'
      # Browser PUT/GET of presigned URLs: MinIO answers the CORS preflight
      # and adds Access-Control-Allow-Origin / Expose-Headers (incl. ETag).
      # Exact origins only (comma-separated), same list as the API CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    # No host ports. The API/worker reach S3 as minio:9000; external clients
    # reach it only through Caddy at s3.${SITE_ADDRESS} (host-based routing,
    # because SigV4 presigned URLs sign the Host header).
    # Image is shell-less, so no container healthcheck; minio-init (mc retries)
    # gates the api instead.
    volumes: [vault_minio:/data]
    networks: [proxy, backend]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    restart: unless-stopped
  # One-shot: creates the bucket if missing (idempotent). mc reads the
  # alias from MC_HOST_local; credentials come from the same required env as
  # everything else. mc image has no shell, so readiness is handled by
  # restart: on-failure (retries until MinIO answers).
  minio-init:
    image: ${MC_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    depends_on:
      minio: { condition: service_started }
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}:${S3_SECRET_KEY:?S3_SECRET_KEY is required}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET:?S3_BUCKET is required}']
    networks: [backend]
    logging: *logging
    restart: on-failure:60
networks:
  # Only Caddy joins this one: published ports + outbound (ACME).
  edge: {}
  # Only the api joins this one: outbound SMTP for sign-up codes.
  mail: {}
  proxy: { internal: true }
  backend: { internal: true }
volumes:
  vault_pgdata: {}
  vault_minio: {}
  vault_caddy_data: {}
  vault_caddy_config: {}
