# Self-host — one backend for cloud + self-host.
# Run from this folder: docker compose up --build
# Build contexts are relative to THIS compose file (infra/docker).
#   api context: ../../apps/api  -> my-secrect/apps/api, Dockerfile there.
# Secrets come from .env in this folder (copy .env.example first). Never commit .env.
# Host publish is Caddy 80/443 only. api:3000 and minio:9000 stay on the Compose network.
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vault_caddy_data:/data
      - vault_caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (your domain, or localhost for a local run)}
    restart: unless-stopped
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://vault:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/vault_production
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
      WEBAUTHN_RP_NAME: my-secrect
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    # No host ports. Other containers reach this process as api:3000.
    # force_ssl redirects plain HTTP, so the probe sends the same forwarded
    # proto Caddy sends and requires the /health body {"ok":true}.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -H "X-Forwarded-Proto: https" http://127.0.0.1:3000/health | grep -Fqx "{\"ok\":true}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://vault:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/vault_production
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
    # Image HEALTHCHECK curls :3000. Sidekiq does not listen there.
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: vault_production
    volumes: [vault_pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U vault -d vault_production'], interval: 5s, timeout: 5s, retries: 12 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  minio:
    # Docker Hub minio/minio is no longer published; override MINIO_IMAGE
    # (e.g. quay.io/minio/minio:<release>) if you prefer the upstream image,
    # but it must provide the `minio` binary as entrypoint args below.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    # No host ports. Other containers reach the S3 API as minio:9000.
    # Image is shell-less, so no container healthcheck; minio-init (mc retries)
    # gates the api instead.
    volumes: [vault_minio:/data]
    restart: unless-stopped
  # One-shot: creates the bucket if missing (idempotent). mc reads the
  # alias from MC_HOST_local; credentials come from the same required env as
  # everything else. mc image has no shell, so readiness is handled by
  # restart: on-failure (retries until MinIO answers).
  minio-init:
    image: ${MC_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    depends_on:
      minio: { condition: service_started }
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}:${S3_SECRET_KEY:?S3_SECRET_KEY is required}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET:?S3_BUCKET is required}']
    restart: on-failure:60
volumes:
  vault_pgdata: {}
  vault_minio: {}
  vault_caddy_data: {}
  vault_caddy_config: {}
