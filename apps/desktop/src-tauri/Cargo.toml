[package]
name = "my-secrect"
version = "0.1.0"
description = "my-secrect — Personal Digital Vault (Tauri desktop shell)"
authors = ["LoyGenics"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "my_secrect_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 only. No fs / shell / http / updater plugins: the only IPC the
# frontend gets is the encrypted key/value store below (see README.md).
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher (encrypted SQLite) compiled from source with a vendored OpenSSL,
# so the build does not depend on a system OpenSSL on any platform.
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }
# Default `v1` feature = macOS Keychain, Windows Credential Manager, Secret
# Service on Linux/BSD. There is no in-memory fallback store: an unsupported
# platform is an error, never a silently forgotten key.
keyring = "4"
getrandom = "0.3"
zeroize = "1"

[features]
# Embed the built frontend (`../dist`) instead of loading the dev server.
# `tauri build` turns this on by itself; the e2e harness needs it explicitly.
custom-protocol = ["tauri/custom-protocol"]

# UI-driven restart/migration check; opt-in (see the file header).
[[test]]
name = "e2e_app"
harness = false

[profile.release]
lto = true
codegen-units = 1
