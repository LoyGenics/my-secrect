# MY SECRET — Security scanning (Phase G, 17 Nov 2026)
#
# STATUS: NEVER RUN. Written from the repo layout on disk; no scan has
# ever executed. A green run here is not an audit and does not make the
# app production-safe (see docs/release-readiness.md, gate 10).
#
# Runs on every PR, on push to main, and weekly (full-history secret scan).
# Git history has NOT been audited — the weekly full-history gitleaks job
# is the first history scan this repo will ever have.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC — full-history secret scan

permissions:
  contents: read
  security-events: write # CodeQL SARIF upload
  pull-requests: write # dependency-review comments

jobs:
  # ---- 1. Gitleaks: secrets in git history (PRs + pushes) ------------------
  # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE on
  # organization repos and exits before scanning. The official CLI does not.
  gitleaks:
    name: gitleaks (working tree)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history available if needed
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${asset}" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository
        run: |
          set -euo pipefail
          cfg="$(mktemp)"
          # The repo config only adds an allowlist. Loading it alone gives
          # gitleaks zero rules, so extend the default ruleset and keep that
          # allowlist. Stopwords drop two generic-api-key false positives
          # (the cipher name, and the documented example key). A real key
          # pattern still fails the job.
          {
            echo '[extend]'
            echo 'useDefault = true'
            echo
            cat .github/gitleaks.toml
            echo 'stopwords = ["XChaCha20-Poly1305", "ex_1234567890abcdef"]'
          } > "$cfg"
          gitleaks detect --source . --config "$cfg" --verbose --redact --exit-code 1

  # ---- 2. Gitleaks: full git history (weekly only) --------------------------
  gitleaks-history:
    name: gitleaks (full history)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${asset}" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan entire history
        run: |
          set -euo pipefail
          cfg="$(mktemp)"
          {
            echo '[extend]'
            echo 'useDefault = true'
            echo
            cat .github/gitleaks.toml
            echo 'stopwords = ["XChaCha20-Poly1305", "ex_1234567890abcdef"]'
          } > "$cfg"
          gitleaks detect --source . --config "$cfg" --log-opts="--all" --verbose --redact --exit-code 1

  # ---- 3. Dependency review (PRs only — blocks new vulnerable deps) --------
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0

  # ---- 4. CodeQL: JavaScript/TypeScript + Ruby ------------------------------
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, ruby]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  # ---- 5. Rust audit (cargo-audit) ------------------------------------------
  cargo-audit:
    name: cargo audit (crypto-core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: native/crypto-core
        run: cargo audit
